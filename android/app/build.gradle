plugins {
    id 'com.android.application'
}

android {
    namespace 'com.h4xtor.share'
    compileSdk 36

    defaultConfig {
        applicationId 'com.h4xtor.share'
        minSdk 29
        targetSdk 36
        // The E2E test builds an older copy (-Ph4xVersionCode/-Ph4xVersionName) to update from.
        versionCode((project.findProperty('h4xVersionCode') ?: '36') as int)
        versionName((project.findProperty('h4xVersionName') ?: '1.5.0') as String)
    }

    signingConfigs {
        // A fixed key so every CI build can be installed over the previous one.
        debug {
            storeFile file('h4xtor-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // CHANGELOG.md ships inside the APK so "Opdateringslog" works offline.
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/changelog')

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
        disable 'GradleDependency', 'OldTargetApi', 'ObsoleteSdkInt', 'UseSwitchCompatOrMaterialCode',
                'SetTextI18n', 'HardcodedText', 'ContentDescription', 'ClickableViewAccessibility',
                'UnusedResources', 'IconLauncherShape', 'MonochromeLauncherIcon'
        htmlReport true
        textReport true
        textOutput file("$buildDir/reports/lint-results.txt")
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    // android.jar only has stubs for org.json; the real thing lets JUnit test the JSON mapping.
    testImplementation 'org.json:json:20231013'
}

def copyChangelog = tasks.register('copyChangelog', Copy) {
    from rootProject.file('../CHANGELOG.md')
    into layout.buildDirectory.dir('generated/changelog')
}
tasks.named('preBuild') { dependsOn copyChangelog }

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.h4xtor.share'
    compileSdk 36

    defaultConfig {
        applicationId 'com.h4xtor.share'
        minSdk 29
        targetSdk 36
        versionCode 13
        versionName '1.0.3'
    }

    signingConfigs {
        // A fixed key so every CI build can be installed over the previous one.
        debug {
            storeFile file('h4xtor-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
        disable 'GradleDependency', 'OldTargetApi', 'ObsoleteSdkInt', 'UseSwitchCompatOrMaterialCode',
                'SetTextI18n', 'HardcodedText', 'ContentDescription', 'ClickableViewAccessibility',
                'UnusedResources', 'IconLauncherShape', 'MonochromeLauncherIcon'
        htmlReport true
        textReport true
        textOutput file("$buildDir/reports/lint-results.txt")
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
}

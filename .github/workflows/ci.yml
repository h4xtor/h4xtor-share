name: CI

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes python3-tk xvfb
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        shell: bash
        run: set -o pipefail; ruff check . 2>&1 | tee ci-output.log
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pytest -rs 2>&1 | tee -a ci-output.log
          else
            pytest -rs 2>&1 | tee -a ci-output.log
          fi
      - name: Report failure on the commit
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### CI failure: test (${{ matrix.os }})"
            echo '```'
            tail -c 60000 ci-output.log 2>/dev/null || echo "no log"
            echo '```'
          } > comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md || true

  desktop-e2e:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install --yes python3-tk xvfb
          python -m pip install -e ".[dev]" playwright
          python -m playwright install --with-deps chromium
      - name: Desktop app + Chrome extension end-to-end
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1400x1000x24" python tests/e2e/chrome_extension_e2e.py 2>&1 | tee ci-output.log
      - name: Report failure on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "### CI failure: desktop-e2e"; echo '```'; tail -c 30000 ci-output.log; echo '```'; } > comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md || true

  python-package:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Build wheel and sdist
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: h4xtor-share-python
          path: dist/*
          if-no-files-found: error

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: h4xtor-share-windows
            binary: h4xtor-share.exe
          - os: macos-latest
            artifact: h4xtor-share-macos
            binary: h4xtor-share
          - os: ubuntu-22.04
            artifact: h4xtor-share-linux
            binary: h4xtor-share
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes python3-tk
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Package executable
        shell: bash
        run: |
          set -o pipefail
          python -m PyInstaller --clean --noconfirm packaging/h4xtor-share.spec 2>&1 | tee ci-output.log
      - name: Smoke test frozen executable imports
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee -a ci-output.log
          import subprocess, sys, time
          proc = subprocess.Popen(["dist/h4xtor-share.exe", "--minimized"])
          time.sleep(12)
          code = proc.poll()
          if code is not None:
              sys.exit(f"executable exited early with code {code}")
          proc.kill()
          print("frozen executable stayed up")
          PY
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error
      - name: Report failure on the commit
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### CI failure: package (${{ matrix.os }})"
            echo '```'
            tail -c 60000 ci-output.log 2>/dev/null || echo "no log"
            echo '```'
          } > comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md || true

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Test and lint Android app
        run: |
          set -o pipefail
          gradle -p android testDebugUnitTest lintDebug --stacktrace 2>&1 | tee ci-output.log
      - name: Build installable APK
        run: |
          set -o pipefail
          gradle -p android assembleDebug 2>&1 | tee -a ci-output.log
      - name: Stage Android artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk h4xtor-share-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: h4xtor-share-android
          path: h4xtor-share-android.apk
          if-no-files-found: error
      - name: Report failure on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### CI failure: android"
            echo '```'
            grep -E "error:|Error|FAILED|What went wrong|e: |lint" ci-output.log | tail -n 80 || true
            echo '--- lint ---'
            cat android/app/build/reports/lint-results.txt 2>/dev/null | grep -B2 -A6 "Error" | head -c 30000 || true
            echo '--- tail ---'
            grep -v -E "^\s+at |^\tat " ci-output.log | tail -c 8000 2>/dev/null || true
            echo '```'
          } > comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md || true

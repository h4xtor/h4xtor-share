name: CI

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes python3-tk xvfb
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        shell: bash
        run: set -o pipefail; ruff check . 2>&1 | tee ci-output.log
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pytest -rs 2>&1 | tee -a ci-output.log
          else
            pytest -rs 2>&1 | tee -a ci-output.log
          fi
      - name: Report failure on the commit
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### CI failure: test (${{ matrix.os }})"
            echo '```'
            tail -c 60000 ci-output.log 2>/dev/null || echo "no log"
            echo '```'
          } > comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md || true

  desktop-e2e:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install --yes python3-tk xvfb
          python -m pip install -e ".[dev]" playwright
          python -m playwright install --with-deps chromium
      - name: Desktop app + Chrome extension end-to-end
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1400x1000x24" python tests/e2e/chrome_extension_e2e.py 2>&1 | tee ci-output.log
      - name: Report failure on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "### CI failure: desktop-e2e"; echo '```'; tail -c 30000 ci-output.log; echo '```'; } > comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md || true

  python-package:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Build wheel and sdist
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: h4xtor-share-python
          path: dist/*
          if-no-files-found: error

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: h4xtor-share-windows
            binary: h4xtor-share.exe
          - os: macos-latest
            artifact: h4xtor-share-macos
            binary: h4xtor-share
          - os: ubuntu-22.04
            artifact: h4xtor-share-linux
            binary: h4xtor-share
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes python3-tk
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Package executable
        shell: bash
        run: |
          set -o pipefail
          python -m PyInstaller --clean --noconfirm packaging/h4xtor-share.spec 2>&1 | tee ci-output.log
      - name: Smoke test frozen executable
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -o pipefail
          python packaging/smoke_test.py dist/h4xtor-share.exe 2>&1 | tee -a ci-output.log
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error
      - name: Report failure on the commit
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### CI failure: package (${{ matrix.os }})"
            echo '```'
            tail -c 60000 ci-output.log 2>/dev/null || echo "no log"
            echo '```'
          } > comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md || true

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Test and lint Android app
        run: |
          set -o pipefail
          gradle -p android testDebugUnitTest lintDebug --stacktrace 2>&1 | tee ci-output.log
      - name: Build installable APK
        run: |
          set -o pipefail
          gradle -p android assembleDebug 2>&1 | tee -a ci-output.log
      - name: Stage Android artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk h4xtor-share-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: h4xtor-share-android
          path: h4xtor-share-android.apk
          if-no-files-found: error
      - name: Report failure on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### CI failure: android"
            echo '```'
            grep -E "error:|Error|FAILED|What went wrong|e: |lint" ci-output.log | tail -n 80 || true
            echo '--- lint ---'
            cat android/app/build/reports/lint-results.txt 2>/dev/null | grep -B2 -A6 "Error" | head -c 30000 || true
            echo '--- tail ---'
            grep -v -E "^\s+at |^\tat " ci-output.log | tail -c 8000 2>/dev/null || true
            echo '```'
          } > comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md || true

  android-e2e:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install desktop core
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: h4xtor-share-android
      - name: Place APK
        run: |
          mkdir -p android/app/build/outputs/apk/debug
          mv h4xtor-share-android.apk android/app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real app in an emulator against the desktop core
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_SHOTS: e2e-shots
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash -c 'set -o pipefail; python tests/e2e/android_e2e.py 2>&1 | tee ci-output.log'
      - name: Publish screenshots
        if: always()
        run: |
          [ -d e2e-shots ] || exit 0
          cp ci-output.log e2e-shots/ 2>/dev/null || true
          cd e2e-shots
          git init -q -b ci-shots
          git config user.name "h4xtor-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Android E2E screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-e2e-shots
          path: e2e-shots
      - name: Report failure on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "### CI failure: android-e2e"; echo '```'; tail -c 25000 ci-output.log; echo '--- logcat ---'; grep -i "h4xtor\|FATAL\|AndroidRuntime" e2e-shots/logcat.txt | tail -n 60; echo '```'; } > comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md || true

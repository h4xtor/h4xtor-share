name: Release

on:
  push:
    tags: ["v*"]
  # Manual start (e.g. when a tag cannot be pushed): creates the tag on this commit.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v1.1.3"
        required: true

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  python-package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(python -c 'import h4xtor_share; print(h4xtor_share.__version__)')"
          test "v${package_version}" = "${RELEASE_TAG}"
      - name: Build wheel and sdist
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: release-python
          path: dist/*
          if-no-files-found: error

  package:
    needs: python-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: h4xtor-share-windows.exe
            binary: h4xtor-share.exe
          - os: macos-latest
            artifact: h4xtor-share-macos
            binary: h4xtor-share
          - os: ubuntu-22.04
            artifact: h4xtor-share-linux
            binary: h4xtor-share
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes python3-tk
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Package executable
        shell: bash
        run: |
          python -m PyInstaller --clean --noconfirm packaging/h4xtor-share.spec
          mv "dist/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  android:
    needs: python-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Test Android app
        run: gradle -p android testDebugUnitTest lintDebug
      - name: Build installable APK
        run: gradle -p android assembleDebug
      - name: Stage Android artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk h4xtor-share-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-h4xtor-share-android
          path: h4xtor-share-android.apk
          if-no-files-found: error

  publish:
    needs: [python-package, package, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: release-dist/*
          fail_on_unmatched_files: true

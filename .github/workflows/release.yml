name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  python-package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Build wheel and sdist
        run: python -m build
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true

  package:
    needs: python-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: h4xtor-share-windows.exe
            binary: h4xtor-share.exe
          - os: macos-latest
            artifact: h4xtor-share-macos
            binary: h4xtor-share
          - os: ubuntu-22.04
            artifact: h4xtor-share-linux
            binary: h4xtor-share
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes python3-tk
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Package executable
        shell: bash
        run: |
          python -m PyInstaller --clean --noconfirm packaging/h4xtor-share.spec
          mv "dist/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
          fail_on_unmatched_files: true
